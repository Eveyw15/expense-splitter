spring.application.name=expense-splitter-backend
server.port=${PORT:8080}

# Receipts and cover photos are shrunk in the browser; this is the hard cap.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Database: Neon Postgres via DATABASE_URL_UNPOOLED / DATABASE_URL (see NeonDataSourceConfig).
spring.jpa.hibernate.ddl-auto=update

# JWT settings
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Comma-separated frontend origins, e.g. https://your-app.vercel.app
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
