spring.application.name=expense-splitter-backend
server.port=${PORT:8080}

# Receipts and cover photos are shrunk in the browser; this is the hard cap.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Database (Neon Postgres in production). DB_URL looks like jdbc:postgresql://host/db?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update

# JWT settings
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Comma-separated frontend origins, e.g. https://your-app.vercel.app
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
