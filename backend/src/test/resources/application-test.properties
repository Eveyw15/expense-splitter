spring.datasource.url=jdbc:h2:mem:tripplanner;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test-only signing key; production uses the JWT_SECRET environment variable.
jwt.secret=jenkins-test-only-jwt-secret-32-bytes-minimum
jwt.expiration-ms=86400000
